<!doctype html>
<html lang="ru" class="theme-c">
<head>
  <!-- мгновенная защита от повторного показа сплэша -->
  <script>
    try {
      if (localStorage.getItem('splash_shown') === '2') {
        document.write('<style>#splash{display:none!important;}</style>');
      }
    } catch (e) {}
  </script>

  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title data-i18n="app.name">Синхронизатор Мысли</title>
  <link rel="stylesheet" href="/themes.css"/>
  <link rel="stylesheet" href="/styles.css"/>
  <script defer src="/themes.js"></script>
  <script defer src="/main.js"></script>
</head>



<body>
  <!-- splash: по умолчанию скрыт -->
  <div id="splash" style="
    position:fixed; inset:0; display:none; z-index:9999;
    background:#000; align-items:center; justify-content:center;">
    <video id="splashVideo"
           playsinline muted autoplay
           preload="metadata"
           style="max-width:100%; max-height:100%; outline:none"
           poster="/favicon.png">
      <source src="https://yakobel.github.io/minute-app-functions/media/app_intro.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Верхняя панель: переключатель языка + темы -->
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
    <div class="h1" data-i18n="nav.home">Главная</div>

    <div style="display:flex;gap:8px;align-items:center;">
      <!-- Переключатель языка -->
      <div class="tabs" id="langSwitch" style="gap:6px;">
	    <button id="aboutBtn" class="lang-btn about-btn">ℹ️</button>
        <button type="button" class="lang-btn" data-lang="ru">RU</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
		<button type="button" class="lang-btn" data-lang="uk">UK</button>
      </div>

      <div class="tabs theme-switch" style="gap:6px;">
        <a href="#" data-theme-link="a">Neo-Noir</a>
        <a href="#" data-theme-link="b">Glass</a>
        <a href="#" data-theme-link="c" class="active">Light</a>
      </div>
    </div>
  </div>

  <!-- HERO AREA: этот контейнер будет переливаться радугой -->
  <div id="hero" class="hero">
    <!-- Fingerprint button -->
	<div class="finger-wrap">
	  <button id="fingerBtn" class="finger-btn" type="button" aria-label="Start minute">
		<!-- прогресс-кольцо -->
		<svg class="finger-ring" width="184" height="184" viewBox="0 0 184 184">
		  <circle class="bg" cx="92" cy="92" r="84" />
		  <circle class="fg" cx="92" cy="92" r="84" />
		  <text class="timer" x="92" y="102" text-anchor="middle" font-size="32" font-family="ui-sans-serif,system-ui">01:00</text>
		</svg>

		<!-- сам отпечаток (SVG-без-ассетов) -->
		<svg class="fingerprint" viewBox="0 0 200 200" aria-hidden="true">
		  <g stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round">
			<path d="M100 30c-32 0-58 26-58 58" />
			<path d="M100 30c32 0 58 26 58 58" />
			<path d="M42 88c0 40 24 72 58 72" />
			<path d="M158 88c0 40-24 72-58 72" />
			<path d="M62 88c0 28 16 50 38 50" />
			<path d="M138 88c0 28-16 50-38 50" />
			<path d="M82 88c0 18 10 32 24 32" />
			<path d="M118 88c0 18-10 32-24 32" />
		  </g>
		</svg>
	  </button>
	</div>
    <!-- Таймер -->
    <div class="card timer">
      <h2 class="page-title" data-i18n="app.name"></h2>
      <div id="countdown" class="big">00:00</div>
	  <div class="small" data-i18n="minute.next">Следующее окно по UTC</div>
      <div class="small" id="nextEta" style="margin-top:6px;color:var(--text-muted,#6b7280);">00:00 / 08:00 / 16:00</div>
    </div>
  </div>
  
  <!-- MODES -->
  <div class="card modes" id="modeBar">
    <div class="row gap-2">
      <button class="mode-btn" id="modeLive" data-i18n="mode.live">⚡ Лайв</button>
      <button class="mode-btn primary" id="modeDefer" data-i18n="mode.defer">⏳ Отложенно</button>
	  <button id="remindBtn" class="mode-btn toggle" type="button" aria-pressed="false">
        🔔
      </button>
    </div>
	<div class="small mt-2" id="modeNote" data-i18n="mode.note.defer">
      Режим «Отложенно»: голос учитывается автоматически в ближайшее окно UTC.
    </div>
  </div>


  <!-- 4 намерения -->
  <div class="card">
    <div class="h1" data-i18n="minute.choose">Выбери намерение</div>
    <div class="cta-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <button class="intent-btn intent-war cta" data-vote="war">
        <span class="icon">🕊</span><span data-i18n="intent.war">Стоп война</span>
      </button>
      <button class="intent-btn intent-climate cta" data-vote="climate">
        <span class="icon">🌍</span><span data-i18n="intent.climate">Катаклизмы</span>
      </button>
      <button class="intent-btn intent-personal cta" data-vote="personal">
        <span class="icon">💖</span><span data-i18n="intent.personal">Личное</span>
      </button>
      <button class="intent-btn intent-family cta" data-vote="family">
        <span class="icon">🤝</span><span data-i18n="intent.family">Близкие</span>
      </button>
    </div>
  </div>

  <!-- Навигация -->
  <div class="card" style="padding:12px;">
    <nav class="tabs">
      <a href="/stats.html" class="tablink" data-i18n="nav.stats">Статистика</a>
      <a href="/profile.html" class="tablink" data-i18n="nav.profile">Профиль</a>
    </nav>
  </div>
  <!-- About modal -->
  <div id="aboutModal" class="modal" hidden>
    <div class="modal__backdrop"></div>
    <div class="modal__card">
      <div class="modal__title" data-i18n="about.title">О проекте</div>
	  <!-- pre-line сохраняет переносы из переводов -->
      <div class="modal__body" data-i18n="about.body" style="white-space: pre-line;"></div>
      <div class="modal__actions">
        <button id="aboutClose" class="btn primary" data-i18n="btn.close">Закрыть</button>
      </div>
    </div>
  </div>
</body>
</html>
